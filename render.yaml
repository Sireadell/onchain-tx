services:
  - type: web
    name: telegraph-onchain-tx-lookup-miner
    runtime: node
    plan: free
    buildCommand: npm ci
    # --max-http-header-size: the router sends the whole question as a GET query
    # string. Node's 16 KB default answers HTTP 431 before Express runs, which
    # forfeits the question. Real traffic peaks near 3 KB today; 64 KB is headroom.
    startCommand: node --use-system-ca --max-http-header-size=65536 src/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: CHAIN
        value: eth
      - key: CONFIRMATION_DEPTH
        value: 12
      - key: ANKR_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NVD_API_KEY
        sync: false
